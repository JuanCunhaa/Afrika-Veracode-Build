name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create GitHub Release from package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version invalida: $VERSION (esperado X.Y.Z)"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "Versao do package.json: $VERSION (tag $TAG)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe — nada a fazer."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          Release ${TAG} of Afrika-Veracode-Build.

          Prefer FULL COMMIT SHA when consuming this Action:

              JuanCunhaa/Afrika-Veracode-Build@${GITHUB_SHA}

          Tag ${TAG} points to this commit and can be used as a version reference.
          EOF

          # strip leading indentation from heredoc
          sed -i 's/^          //' /tmp/release-notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"

          echo "Release $TAG criado em $GITHUB_SHA"
