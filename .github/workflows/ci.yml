name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Unit test coverage
        run: npm run test:coverage

      - name: Action SHA pinning
        run: npm run pr

      - name: actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

      - name: yamllint
        run: |
          set -euo pipefail
          pip install yamllint==1.37.1
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" action.yml internal .github/workflows

  java-maven:
    name: Contract / Java Maven (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: java8-basic
            java: '8'
          - case: java11-basic
            java: '11'
          - case: java17-basic
            java: '17'
          - case: java21-basic
            java: '21'
          - case: war-java17
            java: '17'
          - case: springboot-java17
            java: '17'
          - case: multimodule-java17
            java: '17'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Builder → Doctor contract
        run: |
          set -euo pipefail
          node scripts/run-builder-doctor-contract.js \
            --family java-maven \
            --case "${{ matrix.case }}"

  java-gradle:
    name: Contract / Java Gradle (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: java17-basic
            java: '17'
          - case: java21-basic
            java: '21'
          - case: kotlin-dsl-java17
            java: '17'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Builder → Doctor contract
        env:
          USE_WRAPPER: 'false'
        run: |
          set -euo pipefail
          node scripts/run-builder-doctor-contract.js \
            --family java-gradle \
            --case "${{ matrix.case }}"

  javascript:
    name: Contract / JS (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [vanilla-node, express, react, nestjs-yarn, vue-pnpm]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Builder → Doctor contract
        run: |
          set -euo pipefail
          node scripts/run-builder-doctor-contract.js \
            --family javascript \
            --case "${{ matrix.case }}"

  typescript:
    name: Contract / TS (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [node-typescript, express-typescript, react-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Builder → Doctor contract
        run: |
          set -euo pipefail
          node scripts/run-builder-doctor-contract.js \
            --family typescript \
            --case "${{ matrix.case }}"

  dotnet-modern:
    name: Contract / .NET (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: net6-console
            sdk: '6.0.x'
          - case: net8-console
            sdk: '8.0.x'
          - case: net8-webapi
            sdk: '8.0.x'
          - case: vbnet
            sdk: '8.0.x'
          - case: multi-project-solution
            sdk: '8.0.x'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Builder → Doctor contract
        run: |
          set -euo pipefail
          node scripts/run-builder-doctor-contract.js \
            --family dotnet \
            --case "${{ matrix.case }}"

  dotnet-framework:
    name: Contract / .NET Framework (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Builder → Doctor contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-builder-doctor-contract.js \
            --family dotnet \
            --case net48

  gate:
    name: Gate
    # Fonte de verdade do CI. Todo job de check NOVO deve:
    # 1) entrar em needs abaixo
    # 2) ter needs.<id>.result validado no step
    # Jobs pos-gate (ex.: release) usam needs: [gate] apenas.
    runs-on: ubuntu-latest
    needs:
      [
        quality,
        java-maven,
        java-gradle,
        javascript,
        typescript,
        dotnet-modern,
        dotnet-framework
      ]
    if: always()
    steps:
      - name: Require all parallel jobs green
        run: |
          set -euo pipefail
          echo "quality=${{ needs.quality.result }}"
          echo "java-maven=${{ needs.java-maven.result }}"
          echo "java-gradle=${{ needs.java-gradle.result }}"
          echo "javascript=${{ needs.javascript.result }}"
          echo "typescript=${{ needs.typescript.result }}"
          echo "dotnet-modern=${{ needs.dotnet-modern.result }}"
          echo "dotnet-framework=${{ needs.dotnet-framework.result }}"

          failed=0
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.java-maven.result }}" \
            "${{ needs.java-gradle.result }}" \
            "${{ needs.javascript.result }}" \
            "${{ needs.typescript.result }}" \
            "${{ needs.dotnet-modern.result }}" \
            "${{ needs.dotnet-framework.result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Gate falhou — um ou mais jobs paralelos nao passaram."
            exit 1
          fi

          echo "Gate ok — todas as esteiras passaram."

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [gate]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create GitHub Release from package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version invalida: $VERSION (esperado X.Y.Z)"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "Versao do package.json: $VERSION (tag $TAG)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe — nada a fazer."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          Release ${TAG} of Afrika-Veracode-Build.

          Prefer FULL COMMIT SHA when consuming this Action:

              JuanCunhaa/Afrika-Veracode-Build@${GITHUB_SHA}

          Tag ${TAG} points to this commit and can be used as a version reference.
          EOF

          sed -i 's/^          //' /tmp/release-notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"

          echo "Release $TAG criado em $GITHUB_SHA"
