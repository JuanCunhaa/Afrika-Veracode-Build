# Local Gate — Action-repo quality only (unit/negative/security/completeness).
# Integration, Builder→Doctor contracts, golden artifacts, and Veracode E2E run in
# private Afrika-Veracode-Build-Lab via trusted Lab Orchestrator (lab-orchestrator.yml).
name: CI

on:
  # All branches: feature push gets Local Gate + Lab suite=pr via orchestrator.
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: ESLint + Prettier + actionlint + yamllint
        id: q
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run lint
          npm run format:check
          VERSION=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
          pip install yamllint==1.37.1
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" action.yml internal .github/workflows
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Quality --version - --scenario lint/format --result PASS --seconds $((END-START)) --job quality

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run test:unit
          node scripts/run-unit-tests.js --coverage --root tests/unit
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Unit --version - --scenario unit+coverage --result PASS --seconds $((END-START)) --job unit

  negative:
    name: Negative
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Negative / failure tests
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run test:negative
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Negative --version - --scenario failure-codes --result PASS --seconds $((END-START)) --job negative

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Action SHA pinning + workflow secret policy
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run pr
          npm run check:workflow-secrets
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Security --version - --scenario action-pinning --result PASS --seconds $((END-START)) --job security

  secret-leak:
    name: Secret leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Secret zero-leak suite
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run test:secret-leak
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Security --version - --scenario secret-zero-leak --result PASS --seconds $((END-START)) --job secret-leak

  feature-completeness:
    name: Feature completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Feature Completeness Contract (Action)
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run check:completeness
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Policy --version - --scenario feature-completeness --result PASS --seconds $((END-START)) --job feature-completeness

  support-docs:
    name: Support matrix docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Support matrix + README sync
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run check:support-matrix
          npm run docs:support:check
          END=$(date +%s)
          node scripts/ci-job-report.js --tech Docs --version - --scenario support-matrix --result PASS --seconds $((END-START)) --job support-docs

  local-gate:
    name: Local Gate
    # Fonte de verdade do CI local. Todo job de check NOVO deve:
    # 1) entrar em needs abaixo
    # 2) ter needs.<id>.result validado no step (skipped ok)
    # Lab Compatibility Gate e publicado pelo workflow Lab Orchestrator (separado).
    # Jobs pos-gate (ex.: release) usam needs: [local-gate] apenas.
    runs-on: ubuntu-latest
    needs: [quality, unit, negative, security, secret-leak, feature-completeness, support-docs]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Require parallel jobs green (skipped allowed)
        run: |
          set -euo pipefail
          echo "quality=${{ needs.quality.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "negative=${{ needs.negative.result }}"
          echo "security=${{ needs.security.result }}"
          echo "secret-leak=${{ needs.secret-leak.result }}"
          echo "feature-completeness=${{ needs.feature-completeness.result }}"
          echo "support-docs=${{ needs.support-docs.result }}"

          failed=0
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.negative.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.secret-leak.result }}" \
            "${{ needs.feature-completeness.result }}" \
            "${{ needs.support-docs.result }}"
          do
            # success | skipped OK; failure | cancelled → Local Gate fail
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              failed=1
            fi
          done

          {
            echo "## Local Gate"
            echo ""
            echo "Action-local quality only. Integration/contract/golden/E2E → Lab Compatibility Gate."
            echo ""
            echo "### Job conclusions"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Quality | ${{ needs.quality.result }} |"
            echo "| Unit | ${{ needs.unit.result }} |"
            echo "| Negative | ${{ needs.negative.result }} |"
            echo "| Security | ${{ needs.security.result }} |"
            echo "| Secret leak | ${{ needs.secret-leak.result }} |"
            echo "| Feature completeness | ${{ needs.feature-completeness.result }} |"
            echo "| Support matrix docs | ${{ needs.support-docs.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Local Gate falhou — um ou mais jobs paralelos nao passaram."
            exit 1
          fi

          echo "Local Gate ok"

  # Automatic tag/release on main is DISABLED.
  # Releases require Release Certification Gate SUCCESS for the same source SHA
  # (Local + Lab full + Veracode Pipeline E2E full). Use release-certification.yml.
  release:
    name: Release (gated)
    runs-on: ubuntu-latest
    needs: [local-gate]
    if: false
    permissions:
      contents: read
    steps:
      - name: Release policy
        run: |
          echo "Releases are published only after Release Certification Gate PASS for the candidate SHA."
          exit 1
