# Trusted Lab Orchestrator — MUST only execute code from the default branch.
# Does NOT checkout PR head for orchestrator logic. Fork PRs get an explicit
# failing "Lab Compatibility Gate" check (PENDING_MAINTAINER_VALIDATION) so a
# skip/neutral is never interpreted as PASS for required checks.
#
# After Local Gate (workflow "CI") succeeds on a same-repo SHA, dispatches
# Afrika-Veracode-Build-Lab lab-gate.yml via GitHub App (scripts/lab/dispatch-and-wait.mjs).
#
# Suites: pr | full only. Veracode E2E is a separate trusted workflow.
#
# Event → suite (automatic):
#   push non-main / pull_request / merge_group → pr
#   push main → full
#   draft PR → Lab deferred (DRAFT_PR_LAB_DEFERRED failure check)
name: Lab Orchestrator

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-hex SHA of the Action under test
        type: string
        required: true
      suite:
        description: Lab suite profile (pr or full)
        type: choice
        options: [pr, full]
        default: pr
      source_ref:
        description: Optional source ref for Lab metadata
        type: string
        required: false
        default: ''
      source_pr_number:
        description: Optional PR number
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: write
  checks: write
  statuses: write

# Group by source branch/PR so a new commit cancels the previous Lab wait.
# Do NOT fall back to github.sha (always default-branch tip for workflow_run).
concurrency:
  group: lab-orchestrator-${{ github.event.workflow_run.head_branch || inputs.source_ref || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  orchestrate:
    name: Orchestrate Lab
    runs-on: ubuntu-latest
    steps:
      # TRUST: only default-branch tree for orchestrator scripts (never PR head).
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Resolve source context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_HEAD_FORK: ${{ github.event.workflow_run.head_repository.fork }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          WR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_PR_DRAFT: ${{ github.event.workflow_run.pull_requests[0].draft }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_REF: ${{ inputs.source_ref }}
          INPUT_PR: ${{ inputs.source_pr_number }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SKIP='false'
          FORK='false'
          DRAFT='false'
          SKIP_REASON=''
          SHA=''
          SUITE='pr'
          REF=''
          PR=''
          SOURCE_EVENT=''
          SOURCE_RUN_ID=''
          SOURCE_RUN_ATTEMPT=''

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="${INPUT_SHA}"
            SUITE="${INPUT_SUITE:-pr}"
            if [ "$SUITE" != "pr" ] && [ "$SUITE" != "full" ]; then
              echo "::error::suite must be pr|full, got: ${SUITE}"
              exit 1
            fi
            REF="${INPUT_REF:-}"
            PR="${INPUT_PR:-}"
            SOURCE_EVENT='workflow_dispatch'
            SOURCE_RUN_ID="${GITHUB_RUN_ID}"
            SOURCE_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"
          else
            # workflow_run: only proceed when Local Gate (CI) succeeded
            if [ "${WR_CONCLUSION}" != "success" ]; then
              echo "CI conclusion=${WR_CONCLUSION} — not dispatching Lab."
              SKIP='true'
              SKIP_REASON='LOCAL_GATE_FAILED'
              SHA="${WR_HEAD_SHA}"
            else
              SHA="${WR_HEAD_SHA}"
              SOURCE_EVENT="${WR_EVENT}"
              SOURCE_RUN_ID="${WR_RUN_ID}"
              SOURCE_RUN_ATTEMPT="${WR_RUN_ATTEMPT}"
              REF="${WR_HEAD_BRANCH:-}"
              PR="${WR_PR_NUMBER:-}"

              # Fork PR: do NOT treat as PASS — publish explicit failure check.
              if [ "${WR_EVENT}" = "pull_request" ]; then
                if [ "${WR_HEAD_FORK}" = "true" ] || { [ -n "${WR_HEAD_REPO}" ] && [ "${WR_HEAD_REPO}" != "${REPO}" ]; }; then
                  FORK='true'
                  echo "Fork PR detected (${WR_HEAD_REPO}) — PENDING_MAINTAINER_VALIDATION"
                fi

                # Draft detection: workflow_run payload, else REST if PR number known.
                DRAFT_FLAG="${WR_PR_DRAFT:-}"
                if [ -z "$DRAFT_FLAG" ] && [ -n "$PR" ]; then
                  DRAFT_FLAG="$(curl -fsSL \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${REPO}/pulls/${PR}" \
                    | jq -r '.draft // false')"
                fi
                if [ "$DRAFT_FLAG" = "true" ]; then
                  DRAFT='true'
                  SKIP_REASON='DRAFT_PR_LAB_DEFERRED'
                  echo "Draft PR #${PR} — Lab deferred until ready_for_review"
                fi
              fi

              # Suite: push to default branch → full; otherwise pr
              # (merge_group, feature push, pull_request → pr)
              if [ "${WR_EVENT}" = "push" ] && [ "${WR_HEAD_BRANCH}" = "${DEFAULT_BRANCH}" ]; then
                SUITE='full'
              else
                SUITE='pr'
              fi
            fi
          fi

          if [ -z "$SHA" ]; then
            echo "::error::source_sha could not be resolved"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be 40 hex chars, got: ${SHA}"
            exit 1
          fi

          CORR="lab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHA:0:12}"
          {
            echo "skip=${SKIP}"
            echo "fork=${FORK}"
            echo "draft=${DRAFT}"
            echo "skip_reason=${SKIP_REASON}"
            echo "source_sha=${SHA}"
            echo "suite=${SUITE}"
            echo "source_ref=${REF}"
            echo "source_pr_number=${PR}"
            echo "source_event=${SOURCE_EVENT}"
            echo "source_run_id=${SOURCE_RUN_ID}"
            echo "source_run_attempt=${SOURCE_RUN_ATTEMPT}"
            echo "correlation_id=${CORR}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish check (CI did not succeed — no Lab)
        if: steps.ctx.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg sha "$SHA" \
            '{
              name: "Lab Compatibility Gate",
              head_sha: $sha,
              status: "completed",
              conclusion: "failure",
              output: {
                title: "Local Gate did not succeed — Lab not dispatched",
                summary: "CI (Local Gate) did not succeed for this SHA, so Lab was not dispatched.\n\nFix Local Gate first; Lab Compatibility Gate runs automatically after the next successful CI on this branch."
              }
            }')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/check-runs" \
            -d "$BODY"
          echo "::error::Lab Compatibility Gate failed: Local Gate did not succeed — Lab not dispatched"
          exit 1

      - name: Publish DRAFT_PR_LAB_DEFERRED
        if: steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg sha "$SHA" \
            '{
              name: "Lab Compatibility Gate",
              head_sha: $sha,
              status: "completed",
              conclusion: "failure",
              output: {
                title: "DRAFT_PR_LAB_DEFERRED",
                summary: "Draft PR: Local Gate may pass, but Lab Compatibility is deferred until **ready_for_review**.\n\nMark the PR as ready for review to run Lab suite=pr automatically. This failure must not be treated as a silent PASS."
              }
            }')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/check-runs" \
            -d "$BODY"
          echo "::error::Lab Compatibility DRAFT_PR_LAB_DEFERRED"
          exit 1

      - name: Publish PENDING_MAINTAINER_VALIDATION (fork PR)
        if: steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.draft != 'true' && steps.ctx.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg sha "$SHA" \
            '{
              name: "Lab Compatibility Gate",
              head_sha: $sha,
              status: "completed",
              conclusion: "failure",
              output: {
                title: "PENDING_MAINTAINER_VALIDATION",
                summary: "Fork PR Lab Compatibility is PENDING_MAINTAINER_VALIDATION.\n\nLab secrets are never exposed to fork PR code. After review, a maintainer must re-run **Lab Orchestrator** (workflow_dispatch) on this SHA from the default branch. This failure must not be interpreted as a skipped PASS."
              }
            }')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/check-runs" \
            -d "$BODY"
          echo "::error::Lab Compatibility PENDING_MAINTAINER_VALIDATION (fork PR)"
          exit 1

      - name: Publish Lab Compatibility Gate (in progress)
        if: steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.draft != 'true' && steps.ctx.outputs.fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.source_sha }}
          REPO: ${{ github.repository }}
          CORR: ${{ steps.ctx.outputs.correlation_id }}
          SUITE: ${{ steps.ctx.outputs.suite }}
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg sha "$SHA" \
            --arg corr "$CORR" \
            --arg suite "$SUITE" \
            '{
              name: "Lab Compatibility Gate",
              head_sha: $sha,
              status: "in_progress",
              output: {
                title: "Lab Compatibility Gate running",
                summary: ("Dispatching private Lab gate (`" + $suite + "`) for `" + $sha + "` (correlation `" + $corr + "`). Dedupes same SHA+suite when a valid Lab run already exists.")
              }
            }')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/check-runs" \
            -d "$BODY"

      - name: Dispatch Lab and wait
        id: lab
        if: steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.draft != 'true' && steps.ctx.outputs.fork != 'true'
        env:
          LAB_GITHUB_APP_ID: ${{ secrets.LAB_GITHUB_APP_ID }}
          LAB_GITHUB_APP_PRIVATE_KEY: ${{ secrets.LAB_GITHUB_APP_PRIVATE_KEY }}
          LAB_GITHUB_APP_INSTALLATION_ID: ${{ secrets.LAB_GITHUB_APP_INSTALLATION_ID }}
          LAB_OWNER: JuanCunhaa
          LAB_REPO: Afrika-Veracode-Build-Lab
          LAB_WORKFLOW_FILE: lab-gate.yml
          LAB_REF: main
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.ctx.outputs.source_sha }}
          SOURCE_REF: ${{ steps.ctx.outputs.source_ref }}
          SOURCE_EVENT: ${{ steps.ctx.outputs.source_event }}
          SOURCE_RUN_ID: ${{ steps.ctx.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.ctx.outputs.source_run_attempt }}
          SOURCE_PR_NUMBER: ${{ steps.ctx.outputs.source_pr_number }}
          SUITE: ${{ steps.ctx.outputs.suite }}
          CORRELATION_ID: ${{ steps.ctx.outputs.correlation_id }}
          POLL_INTERVAL_MS: '15000'
          TIMEOUT_MS: '3600000'
        run: node scripts/lab/dispatch-and-wait.mjs

      - name: Publish Lab Compatibility Gate check
        if: always() && steps.ctx.outputs.skip != 'true' && steps.ctx.outputs.draft != 'true' && steps.ctx.outputs.fork != 'true' && steps.lab.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ctx.outputs.source_sha }}
          REPO: ${{ github.repository }}
          LAB_OUTCOME: ${{ steps.lab.outcome }}
          CORR: ${{ steps.ctx.outputs.correlation_id }}
          SUITE: ${{ steps.ctx.outputs.suite }}
          LAB_RUN_URL: ${{ steps.lab.outputs.lab_run_url }}
          DEDUPE: ${{ steps.lab.outputs.dedupe }}
        run: |
          set -euo pipefail
          if [ "${LAB_OUTCOME}" = "success" ]; then
            CONCLUSION=success
            TITLE='Lab Compatibility Gate passed'
            SUMMARY="Lab gate succeeded for \`${SHA}\` (suite \`${SUITE}\`, correlation \`${CORR}\`, dedupe=\`${DEDUPE:-unknown}\`)."
          else
            CONCLUSION=failure
            TITLE='Lab Compatibility Gate failed'
            SUMMARY="Lab gate failed or errored for \`${SHA}\` (suite \`${SUITE}\`, correlation \`${CORR}\`). See Lab Orchestrator job logs."
          fi
          BODY=$(jq -n \
            --arg sha "$SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            --arg details "${LAB_RUN_URL:-}" \
            --arg suite "$SUITE" \
            '{
              name: "Lab Compatibility Gate",
              head_sha: $sha,
              status: "completed",
              conclusion: $conclusion,
              output: {
                title: $title,
                summary: ($summary + "\n\nSuite: `" + $suite + "`")
              }
            } + (if $details != "" then { details_url: $details } else {} end)')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/check-runs" \
            -d "$BODY"
          if [ "$CONCLUSION" != "success" ]; then
            exit 1
          fi
