name: Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Discovery + JS package + Doctor
        run: |
          set -euo pipefail
          mkdir -p .veracode-build
          export SOURCE=tests/fixtures/javascript
          export PROJECT_PATH=.
          export OUTPUT_DIR=.veracode-build
          export LANGUAGE=javascript
          export CONFIG_MODE=disabled
          node internal/discovery/index.js
          export BUILD_PLAN_PATH=.veracode-build/build-plan.json
          export ARTIFACT_NAME=analysisPack.zip
          node internal/builder/javascript/index.js
          export ARTIFACT_PATH=.veracode-build/analysisPack.zip
          export DOCTOR_MODE=standard
          node internal/doctor/index.js

  java-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Maven build packaging
        run: |
          set -euo pipefail
          mkdir -p .veracode-build
          export SOURCE=tests/fixtures/java-maven
          export OUTPUT_DIR=.veracode-build
          node internal/discovery/index.js
          export BUILD_PLAN_PATH=.veracode-build/build-plan.json
          export RESTORE_DEPENDENCIES=true
          export RUN_TESTS=false
          node internal/builder/java-maven/index.js
          export ARTIFACT_PATH=.veracode-build/analysisPack.zip
          node internal/doctor/index.js

  dotnet-modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: dotnet publish packaging
        run: |
          set -euo pipefail
          mkdir -p .veracode-build
          export SOURCE=tests/fixtures/dotnet-modern
          export OUTPUT_DIR=.veracode-build
          node internal/discovery/index.js
          export BUILD_PLAN_PATH=.veracode-build/build-plan.json
          node internal/builder/dotnet/index.js
          export ARTIFACT_PATH=.veracode-build/analysisPack.zip
          node internal/doctor/index.js
